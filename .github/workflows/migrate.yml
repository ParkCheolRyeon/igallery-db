name: Migrate RDS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - production
        default: production
      skip_backup:
        description: 'Skip RDS pre-deploy snapshot (NOT recommended)'
        required: false
        type: boolean
        default: false

concurrency:
  group: migrate-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write    # OIDC
  contents: read

env:
  AWS_REGION: ap-northeast-2
  DB_INSTANCE_ID: igallerydb-postgres9dc8bb04-0pxykud8e4t5
  DEPLOY_ROLE_ARN: arn:aws:iam::588344796279:role/gh-actions-igallery-db-migrate
  SOURCE_BUCKET: igallery-db-migrate-source-588344796279
  CODEBUILD_PROJECT: igallery-db-migrate-build

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pre-deploy RDS snapshot
        id: snapshot
        if: ${{ !inputs.skip_backup }}
        run: |
          set -e
          SHORT_SHA="${GITHUB_SHA::7}"
          TS=$(date -u +%Y%m%d-%H%M%S)
          SNAP_ID="${{ inputs.environment }}-pre-deploy-${SHORT_SHA}-${TS}"
          echo "📸 Creating snapshot: $SNAP_ID"
          aws rds create-db-snapshot \
            --db-instance-identifier "$DB_INSTANCE_ID" \
            --db-snapshot-identifier "$SNAP_ID" \
            --region "$AWS_REGION" \
            --tags "Key=Environment,Value=${{ inputs.environment }}" \
                   "Key=Purpose,Value=pre-migrate-backup" \
                   "Key=WorkflowRun,Value=${{ github.run_id }}" \
                   "Key=Commit,Value=$SHORT_SHA" > /dev/null
          echo "snapshot_id=$SNAP_ID" >> "$GITHUB_OUTPUT"
          echo "⏳ Waiting for snapshot — 1~5 분"
          aws rds wait db-snapshot-available --db-snapshot-identifier "$SNAP_ID" --region "$AWS_REGION" \
            || echo "::warning::Snapshot wait timed out, continuing anyway"
          echo "✅ Snapshot ready: $SNAP_ID"

      - name: Package source
        run: |
          set -e
          # CodeBuild 가 빌드할 파일만 추려서 zip
          zip -r source.zip Dockerfile.migrate migrations/ scripts/ -x '*.DS_Store' '*.git*'
          ls -la source.zip

      - name: Upload source to S3
        run: |
          aws s3 cp source.zip "s3://$SOURCE_BUCKET/source.zip" --region "$AWS_REGION"

      - name: Trigger CodeBuild
        id: build
        run: |
          set -e
          BUILD_ID=$(aws codebuild start-build \
            --project-name "$CODEBUILD_PROJECT" \
            --environment-variables-override "name=GIT_SHA,value=${GITHUB_SHA::8}" \
            --query 'build.id' --output text \
            --region "$AWS_REGION")
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          ESC_ID=$(printf '%s' "$BUILD_ID" | sed 's/:/%3A/g')
          {
            echo "## 🔨 CodeBuild started"
            echo ""
            echo "- **Build ID**: \`$BUILD_ID\`"
            echo "- **Console**: https://${AWS_REGION}.console.aws.amazon.com/codesuite/codebuild/projects/${CODEBUILD_PROJECT}/build/${ESC_ID}/?region=${AWS_REGION}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for CodeBuild
        run: |
          set -e
          BUILD_ID="${{ steps.build.outputs.build_id }}"
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' --output text --region "$AWS_REGION")
            echo "Build status: $STATUS"
            case "$STATUS" in
              SUCCEEDED)
                echo "✅ CodeBuild succeeded"
                exit 0
                ;;
              FAILED|FAULT|TIMED_OUT|STOPPED)
                echo "❌ CodeBuild ended with $STATUS"
                # 마지막 로그 50줄 surface — debugging 동선 줄이기
                aws codebuild batch-get-builds --ids "$BUILD_ID" \
                  --query 'builds[0].logs.{group:groupName,stream:streamName}' \
                  --output table --region "$AWS_REGION" || true
                exit 1
                ;;
              IN_PROGRESS)
                sleep 15
                ;;
              *)
                echo "::warning::Unknown status: $STATUS"
                sleep 15
                ;;
            esac
          done

      - name: Cleanup old pre-deploy snapshots (retention 5)
        if: ${{ !inputs.skip_backup && always() }}
        run: |
          RETENTION=5
          PREFIX="${{ inputs.environment }}-pre-deploy-"
          SNAPS=$(aws rds describe-db-snapshots \
            --db-instance-identifier "$DB_INSTANCE_ID" \
            --snapshot-type manual \
            --region "$AWS_REGION" \
            --query "DBSnapshots[?starts_with(DBSnapshotIdentifier, '$PREFIX')]|sort_by(@, &SnapshotCreateTime)|[*].DBSnapshotIdentifier" \
            --output text)
          if [ -z "$SNAPS" ]; then
            echo "No snapshots to cleanup"; exit 0
          fi
          TOTAL=$(echo "$SNAPS" | wc -w | tr -d ' ')
          echo "Found $TOTAL pre-deploy snapshots (retention=$RETENTION)"
          if [ "$TOTAL" -le "$RETENTION" ]; then
            echo "Nothing to delete"; exit 0
          fi
          DELETE=$((TOTAL - RETENTION))
          for SNAP in $(echo "$SNAPS" | tr '\t' '\n' | head -n "$DELETE"); do
            echo "🗑️ Deleting: $SNAP"
            aws rds delete-db-snapshot --db-snapshot-identifier "$SNAP" --region "$AWS_REGION" >/dev/null || true
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## Migrate to ${{ inputs.environment }}"
            echo ""
            echo "- **Status**: ${{ job.status }}"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Triggered by**: @${{ github.actor }}"
            echo "- **Snapshot**: \`${{ steps.snapshot.outputs.snapshot_id || 'skipped' }}\`"
            echo "- **CodeBuild**: \`${{ steps.build.outputs.build_id || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
